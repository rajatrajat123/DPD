name: Aura Platform CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  backend-verify:
    name: Go Backend (Lint, Vet, Migrations & Tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.24.x"
          cache-dependency-path: backend/go.sum

      - name: Check gofmt formatting
        run: |
          UNFORMATTED=$(gofmt -s -l .)
          if [ -n "$UNFORMATTED" ]; then
            echo "Unformatted Go files detected:"
            echo "$UNFORMATTED"
            exit 1
          fi

      - name: Run go vet
        run: go vet ./...

      - name: Validate embedded SQL migrations and SHA-256 checksums
        run: go run ./cmd/migrate -direction=validate

      - name: Build API and Migration binaries
        run: |
          go build -v -o bin/aura-api ./cmd/api
          go build -v -o bin/aura-migrate ./cmd/migrate

      - name: Run Go unit and integration tests
        run: go test -v -race ./...

  web-seo-verify:
    name: Next.js Web & Enterprise SEO Suite
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: TypeScript typecheck
        run: npm run typecheck

      - name: ESLint check
        run: npm run lint

      - name: Next.js production build
        run: npm run build

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run 37 Enterprise SEO Playwright tests
        run: npm run test:seo
