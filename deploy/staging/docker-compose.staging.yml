version: '3.8'

services:
  # --------------------------------------------------------------------------
  # PostgreSQL 16 + PostGIS 3.4 Spatial Database
  # --------------------------------------------------------------------------
  postgres:
    image: postgis/postgis:16-3.4-alpine
    container_name: aura-staging-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-aura}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-aura_staging_secure_password}
      POSTGRES_DB: ${POSTGRES_DB:-aura_staging}
    volumes:
      - staging_pgdata:/var/lib/postgresql/data
    networks:
      - aura-staging-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-aura} -d ${POSTGRES_DB:-aura_staging}"]
      interval: 5s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2048M

  # --------------------------------------------------------------------------
  # Redis 7.4 Session & Cache
  # --------------------------------------------------------------------------
  redis:
    image: redis:7.4-alpine
    container_name: aura-staging-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD:-staging_redis_pass}"]
    volumes:
      - staging_redisdata:/data
    networks:
      - aura-staging-net
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-staging_redis_pass}", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M

  # --------------------------------------------------------------------------
  # Database Migration Runner (Runs 000001-000012 before API launch)
  # --------------------------------------------------------------------------
  migration-init:
    build:
      context: ../../backend
      dockerfile: Dockerfile
    container_name: aura-staging-migration
    entrypoint: ["/app/aura-migrate", "-direction=up"]
    environment:
      APP_ENV: staging
      DATABASE_URL: postgres://${POSTGRES_USER:-aura}:${POSTGRES_PASSWORD:-aura_staging_secure_password}@postgres:5432/${POSTGRES_DB:-aura_staging}?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - aura-staging-net
    restart: "no"

  # --------------------------------------------------------------------------
  # Aura Go API Server & WebSocket Gateway
  # --------------------------------------------------------------------------
  api:
    build:
      context: ../../backend
      dockerfile: Dockerfile
    container_name: aura-staging-api
    restart: unless-stopped
    environment:
      APP_ENV: staging
      SERVICE_NAME: aura-api
      HTTP_PORT: 8080
      DATABASE_URL: postgres://${POSTGRES_USER:-aura}:${POSTGRES_PASSWORD:-aura_staging_secure_password}@postgres:5432/${POSTGRES_DB:-aura_staging}?sslmode=disable
      REDIS_URL: redis://:${REDIS_PASSWORD:-staging_redis_pass}@redis:6379/0
      JWT_SIGNING_SECRET: ${JWT_SIGNING_SECRET}
      AURA_SESSION_HMAC_SECRET: ${AURA_SESSION_HMAC_SECRET}
      CORS_ALLOWED_ORIGINS: "https://staging.auradating.com,https://admin.staging.auradating.com,http://localhost:3000"
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-sk_test_placeholder}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-whsec_placeholder}
      APPLE_SHARED_SECRET: ${APPLE_SHARED_SECRET:-apple_sandbox_secret}
    ports:
      - "8080:8080"
    depends_on:
      migration-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - aura-staging-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/healthz"]
      interval: 10s
      timeout: 3s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 1024M

  # --------------------------------------------------------------------------
  # Aura Next.js 15 Website & Admin Shell
  # --------------------------------------------------------------------------
  web:
    build:
      context: ../../web
      dockerfile: Dockerfile
    container_name: aura-staging-web
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      NEXT_PUBLIC_SITE_URL: "https://staging.auradating.com"
      NEXT_PUBLIC_API_URL: "http://api:8080"
    ports:
      - "3000:3000"
    depends_on:
      api:
        condition: service_healthy
    networks:
      - aura-staging-net
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/"]
      interval: 15s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 1024M

networks:
  aura-staging-net:
    driver: bridge

volumes:
  staging_pgdata:
  staging_redisdata:
